name: Stage 6 offline tests

on:
  push:
    paths:
      - "src/**"
      - "scripts/generic_stage6_pilot.py"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/stage6-offline-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/generic_stage6_pilot.py"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/stage6-offline-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q
